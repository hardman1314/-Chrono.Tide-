name: chrono_tide
description: "Chrono Tide - Galgame Manager"
publish_to: 'none'
version: 3.0.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.4.3
  flutter_svg: ^2.0.10
  pocketbase: ^0.23.2
  shared_preferences: ^2.2.3
  shared_preferences_platform_interface: ^2.4.1
  file: ^7.0.1
  file_picker: ^8.0.0
  auto_size_text: ^3.0.0
  dio: ^5.4.0
  path: ^1.9.0
  path_provider: ^2.1.5
  package_info_plus: ^8.0.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  http: ^1.2.0
  desktop_drop: 0.7.1
  system_tray: ^2.0.3
  fl_chart: ^0.69.0
  archive: ^3.6.1
  ffi: ^2.1.2
  # .enc 解密（S.S.E. File Encryptor v4）：AES/Serpent/Twofish/Blowfish/Skein/SHA3/Argon2id/HKDF
  pointycastle: ^3.9.1
  onnxruntime: ^1.4.1
  luna_metadata_sdk:
    path: lib/packages/luna_metadata_sdk
  video_player: ^2.9.5
  video_player_win: ^3.3.0

dependency_overrides:
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/themes/
    - assets/images/app_icon.ico
    - assets/tools/bz.exe
    - assets/tools/UnRAR.exe
    - assets/tools/ark.x64.dll
    - assets/tools/ark.x64.lgpl.dll
    - assets/tools/bdzshl.x64.dll
    - assets/magpie/scaling_modes_template.json
    # 会社归一化别名词典（features/company_alias_normalization.md §3）
    - assets/data/company_aliases.json
    # 分类匣·标签受控词表（维度注册表 + 概念/别名；features/category_box.md）
    - assets/data/tag_dimensions.json
    - assets/data/tag_vocabulary.json
    - assets/data/manifest.yaml.gz
    - assets/models/anime_dbrating_mv3_v0.onnx
    - assets/bpm_import/mode_single.png
    - assets/bpm_import/mode_batch.png

  # 字体声明（2026-09-08 三字体分工策略 → 2026-09-08 v2 改用得意黑）
  # F1 得意黑 (Smiley Sans) - 中文装饰大标题（24-38px），几何装饰/重笔画，OFL
  # F2 Outfit - 英文/数字装饰，Outfit（OFL）
  # F3 Noto Sans SC - UI 功能字体（11-16px），Noto Sans SC（OFL，Adobe+Google 联合）
  # 全部字体经 fonttools 子集化，子集内含项目扫描字符 + GB2312 一级常用字表（3755 字，字频序）
  fonts:
    - family: SmileySans
      fonts:
        - asset: assets/fonts/SmileySans.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
